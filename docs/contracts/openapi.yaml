openapi: 3.0.3
info:
  title: DrySG API
  version: 0.1.0
  description: |
    Laundry drying recommendation and monitoring API.
    Served by API Gateway -> API Lambda (FastAPI + Mangum).

    All timestamps are ISO 8601 with Singapore offset (+08:00).
    Errors use the shared `Error` schema.

    Response bodies use camelCase and match the frontend TypeScript types
    (`DryingRecommendation`, `LaundrySession`, ...). The Python core models stay
    snake_case; the API layer maps between them. Scoring method and full contract:
    lambda-backend.md.

    Implementation status: recommendation and laundry-session routes are implemented.
    `/users` and `/users/verify` are specified but not built yet.
servers:
  - url: http://localhost:8000
    description: Local FastAPI (uvicorn), see services/scripts/run_api_local.py
  - url: https://{apiId}.execute-api.ap-southeast-1.amazonaws.com
    description: AWS (filled in by IaC)
    variables:
      apiId:
        default: TBD

paths:
  /recommendation:
    get:
      summary: Current drying score for a postal code
      description: |
        Resolves the postal code to its nearest NEA forecast area and returns the
        latest cached snapshot. Never calls NEA directly on the request path unless
        no snapshot exists for the area (cold start fallback). A snapshot older than
        30 minutes is treated as unavailable (503).

        The recommendation is decided in two steps: a rain veto (rain at the nearest
        station, or rain words in the 2-hour forecast) forces `DO_NOT_HANG`; otherwise
        the score decides (70-100 `HANG_NOW`, 50-69 `WAIT`, below 50 `DO_NOT_HANG`).
        PSI above 100 sets `airQualityWarning` and never changes the recommendation.
      operationId: getRecommendation
      parameters:
        - name: postalCode
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{6}$'
          example: '570150'
      responses:
        '200':
          description: Recommendation for the area
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DryingRecommendation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /users:
    post:
      summary: Register an email and send a verification link
      description: |
        Idempotent. Re-sending to an unverified email issues a new token (the old link
        stops working); at most one email per address per minute. An already verified
        email gets `verified: true` and no email. Links expire after 24 hours.
        The emailed link points to the frontend: `{APP_BASE_URL}/verify?email=..&token=..`,
        which then calls `POST /users/verify`.
        Call this when `POST /laundry-sessions` returns `403 EMAIL_NOT_VERIFIED`.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Verification email sent (or already verified)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/EmailUnavailable' }

  /users/verify:
    post:
      summary: Confirm email ownership with the emailed token
      description: |
        Repeating it after success returns `verified: true` again. A wrong, replaced,
        used or expired token returns `400 INVALID_TOKEN`.
      operationId: verifyUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: { type: string, format: email }
                token: { type: string }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/EmailUnavailable' }

  /laundry-sessions:
    post:
      summary: Start monitoring (laundry is now hanging outside)
      description: |
        Requires a verified email. Only one active session per email; starting a new
        one atomically stops the previous. Sessions expire after 12 hours; API
        timestamps use whole seconds to match the DynamoDB TTL. The user row tracks
        active_session_id so concurrent requests cannot create two active sessions.
        The baseline snapshot must use the current scoring method.
      operationId: startLaundrySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, postalCode]
              properties:
                email: { type: string, format: email }
                postalCode: { type: string, pattern: '^\d{6}$' }
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaundrySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Email not verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Concurrent session changes exhausted retries; try again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /laundry-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The session's `session_id` (UUID4). Acts as the bearer secret for the session (also used in email stop links).
        schema: { type: string, format: uuid }
    get:
      summary: Session status (fetch the score separately with GET /recommendation)
      operationId: getLaundrySession
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaundrySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      summary: Stop monitoring (laundry brought in)
      description: Idempotent. Stopping an already stopped/expired session returns 200.
      operationId: stopLaundrySession
      responses:
        '200':
          description: Session stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaundrySession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  responses:
    BadRequest:
      description: Invalid input (e.g. malformed postal code or email, bad token)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Postal code or session not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Weather or postal data temporarily unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: A verification email was sent less than a minute ago (`RESEND_TOO_SOON`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EmailUnavailable:
      description: |
        The verification email could not be sent, or email is not configured
        (`EMAIL_UNAVAILABLE`). In the SES sandbox this includes recipients that are not
        verified in SES.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_POSTAL_CODE
                - POSTAL_CODE_NOT_FOUND
                - INVALID_EMAIL
                - INVALID_REQUEST
                - INVALID_TOKEN
                - INVALID_SESSION_ID
                - EMAIL_NOT_VERIFIED
                - SESSION_NOT_FOUND
                - SESSION_CONFLICT
                - RESEND_TOO_SOON
                - DATA_UNAVAILABLE
                - EMAIL_UNAVAILABLE
                - INTERNAL_ERROR
            message: { type: string }

    RecommendationState:
      type: string
      enum: [HANG_NOW, WAIT, DO_NOT_HANG]
      description: Maps from the core `Band` ("Hang Now" / "Wait" / "Do Not Hang").

    WeatherConditions:
      type: object
      description: |
        Current inputs for display. A value is null when its feed was unavailable. A
        missing temperature, humidity or wind reading is scored with its historical
        median (`degraded` is then true) but still shown as null. Rain is decided from
        whichever of rainfall and forecast is available.
      required: [rainfallMm, temperatureC, humidityPercent, windSpeedMs, forecast, psi, psiBand]
      properties:
        rainfallMm: { type: number, nullable: true, description: 5-minute rainfall total at the nearest station }
        temperatureC: { type: number, nullable: true }
        humidityPercent: { type: number, nullable: true }
        windSpeedMs:
          type: number
          nullable: true
          description: Metres per second. NEA reports knots; the API converts (1 kt = 0.514444 m/s), 1 decimal place.
        forecast: { type: string, nullable: true, example: Partly Cloudy (Day), description: NEA 2-hour forecast text for the area }
        psi: { type: number, nullable: true, description: 24-hour PSI for the area's region }
        psiBand:
          type: string
          nullable: true
          enum: [Good, Moderate, Unhealthy, Very Unhealthy, Hazardous, null]

    StationSources:
      type: object
      description: |
        Which NEA station supplied each local observation. Rainfall, humidity,
        temperature and wind may come from different nearby stations. Values are
        NEA station IDs (e.g. `S109`); null if that reading is unavailable.
      required: [rainfall, humidity, temperature, wind]
      properties:
        rainfall: { type: string, nullable: true }
        humidity: { type: string, nullable: true }
        temperature: { type: string, nullable: true }
        wind: { type: string, nullable: true }

    DryingRecommendation:
      type: object
      required: [postalCode, areaName, score, recommendation, summary, updatedAt, conditions, rainVeto, airQualityWarning]
      properties:
        postalCode: { type: string, example: '530123' }
        areaName: { type: string, example: Hougang, description: NEA forecast area nearest the postal code }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Percentile of the current Drying Potential (temperature, humidity, wind) within
            historical Singapore dry-weather readings. Still returned when a rain veto applies.
        recommendation: { $ref: '#/components/schemas/RecommendationState' }
        summary:
          type: string
          description: One-line human-readable explanation, e.g. the rain veto reason. Adds an air-quality sentence when PSI is above 100.
        percentileDescription:
          type: string
          nullable: true
          description: How today compares with historical conditions. Null when a rain veto applies.
          example: Drier than 82% of Singapore dry-weather readings in 2024
        updatedAt: { type: string, format: date-time, description: When the area snapshot was computed }
        conditions: { $ref: '#/components/schemas/WeatherConditions' }
        rainVeto: { type: boolean, description: True if rain is detected or forecast; recommendation is then DO_NOT_HANG }
        airQualityWarning:
          type: boolean
          description: True when psiBand is Unhealthy or worse (PSI > 100). Shown separately; never affects the score.
        stationSources: { $ref: '#/components/schemas/StationSources' }
        degraded:
          type: boolean
          default: false
          description: |
            True when a temperature, humidity or wind feed was missing and its historical
            median was used instead, so the score is an estimate. `summary` says so too.

    UserStatus:
      type: object
      required: [email, verified]
      properties:
        email: { type: string, format: email }
        verified: { type: boolean }

    LaundrySession:
      type: object
      required: [id, postalCode, email, areaName, startedAt, expiresAt, active]
      properties:
        id: { type: string, format: uuid, description: The session's `session_id`; also used in email stop links }
        postalCode: { type: string }
        email: { type: string, format: email }
        areaName: { type: string }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        active:
          type: boolean
          description: True while status is `active` and not past `expiresAt`; false once stopped or expired.
        lastAlertState:
          allOf:
            - $ref: '#/components/schemas/RecommendationState'
          description: Last alert state recorded by the notifier, not proof of email delivery. Omitted when no alert state has been recorded.
